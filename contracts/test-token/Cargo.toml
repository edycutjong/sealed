[package]
name = "test-token"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Test USDC: NEP-141, fixed supply minted at init, NO mint or admin method — labelled 'test token minted by us'"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }
near-contract-standards = "=5.9.0"

[dev-dependencies]
near-sdk = { version = "=5.9.0", features = ["legacy", "unit-testing"] }
