[package]
name = "itests"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone workspace: near-workspaces pulls a large tree and must not inherit the contracts' panic=abort.
[workspace]

[dependencies]
near-workspaces = "=0.24.0"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
base64 = "0.23"
sha2 = "0.10"
