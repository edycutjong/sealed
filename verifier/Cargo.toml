[package]
name = "verifier"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Runs a sealed exploit against a committed EVM snapshot and reports whether the level's own validateInstance says it broke"

[lib]
path = "src/lib.rs"

[[bin]]
name = "verifier"
path = "src/main.rs"

[[bin]]
name = "snapgen"
path = "src/bin/snapgen.rs"

[dependencies]
revm = { version = "43", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
crypto_box = { version = "0.9", default-features = false, features = ["salsa20", "std"] }
blake2 = "0.11"
