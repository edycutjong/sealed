<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Sealed Exploit — A tamper-taped evidence bag, still sealed, stamped PAID in green; the receipt beneath carries the tx hash. A TEE scan reads the sealed bag, the PAID stamp lands, then the tape tears.">
<!-- STORYBOARD (dur 6s — must equal this file's single master dur)
  0-25%   steady state: kraft evidence bag, red tamper tape intact with its perforation — the poster (no stamp yet)
  25-42%  trigger:      the TEE scan beam sweeps the bag without opening it                    data-story="beat-2"
  42-52%  mechanism:    A tamper-taped evidence bag, still sealed, stamped PAID in green; the receipt beneath carries the tx hash.
                        (the receipt is the static icon's job; here the stamp ring draws in 45-49% and the
                        PAID stamp slams at 46-49%, then holds)                                 data-story="beat-3"
  52-80%  resolution:   the tape tears along its perforation (52-57%); PAID stays (49-94%)        data-story="beat-4"
  80-100% breathe:      green glow breath 80-92%, story fades 94-98%, done before the seam       data-story="beat-5"
-->
<defs>
  <linearGradient id="kraft" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3EAD5"/><stop offset="1" stop-color="#E4D7B9"/></linearGradient>
  <linearGradient id="tapeI" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C8361D"/><stop offset="1" stop-color="#A82D18"/></linearGradient>
  <linearGradient id="beamI" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFBF0" stop-opacity="0"/><stop offset=".5" stop-color="#FFFBF0" stop-opacity=".95"/><stop offset="1" stop-color="#FFFBF0" stop-opacity="0"/></linearGradient>
  <clipPath id="plateI"><rect x="31" y="31" width="450" height="450" rx="84"/></clipPath>
  <clipPath id="tL"><polygon points="-60,130 233,130.0 251,147.0 233,164.0 251,181.0 233,198.0 251,215.0 233,232.0 251,249.0 233,266.0 -60,266"/></clipPath>
  <clipPath id="tR"><polygon points="600,130 233,130.0 251,147.0 233,164.0 251,181.0 233,198.0 251,215.0 233,232.0 251,249.0 233,266.0 600,266"/></clipPath>
  <filter id="softI" x="-40%" y="-5%" width="180%" height="110%"><feGaussianBlur stdDeviation="10"/></filter>
  <filter id="glowI" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="16"/></filter>
</defs>
<style>
  .slam { transform-box: fill-box; transform-origin: center; animation: slam 6s infinite; }
  @keyframes slam {
    0%, 46% { opacity: 0; transform: scale(1.7) rotate(8deg); animation-timing-function: cubic-bezier(.2, 1.4, .4, 1); }
    49% { opacity: 1; transform: scale(.93) rotate(-1deg); }
    51.5%, 94% { opacity: 1; transform: scale(1) rotate(0deg); }
    98%, 100% { opacity: 0; transform: scale(1) rotate(0deg); }
  }
  .breath { animation: breath 6s infinite; }
  @keyframes breath { 0%, 78% { opacity: 0; } 86% { opacity: .6; } 92%, 100% { opacity: 0; } }
  [data-story] { will-change: opacity; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<rect x="24" y="24" width="464" height="464" rx="90" fill="url(#kraft)" stroke="#1E1B16" stroke-width="14"/>
<g clip-path="url(#plateI)">
  <line x1="70" y1="96" x2="442" y2="96" stroke="#1E1B16" stroke-width="6" stroke-linecap="round" opacity=".32"/>
  <g transform="rotate(-9 256 196)">
    <g clip-path="url(#tL)">
      <animateTransform attributeName="transform" type="rotate" values="0 -30 198;0 -30 198;5 -30 198;5 -30 198;0 -30 198;0 -30 198" keyTimes="0;0.52;0.57;0.94;0.98;1" dur="6s" repeatCount="indefinite"/>
      <rect x="-30" y="146" width="572" height="104" fill="url(#tapeI)"/>
      <g fill="#FBF6EA" opacity=".95"><rect x="18" y="187" width="84" height="22" rx="2"/><rect x="114" y="187" width="12" height="22" rx="6"/><rect x="138" y="187" width="56" height="22" rx="2"/></g>
    </g>
    <g clip-path="url(#tR)">
      <animateTransform attributeName="transform" type="rotate" values="0 542 198;0 542 198;6 542 198;6 542 198;0 542 198;0 542 198" keyTimes="0;0.52;0.57;0.94;0.98;1" dur="6s" repeatCount="indefinite"/>
      <rect x="-30" y="146" width="572" height="104" fill="url(#tapeI)"/>
      <g fill="#FBF6EA" opacity=".95"><rect x="290" y="187" width="84" height="22" rx="2"/><rect x="386" y="187" width="12" height="22" rx="6"/><rect x="410" y="187" width="56" height="22" rx="2"/></g>
    </g>
    <line x1="242" y1="146" x2="242" y2="250" stroke="#FBF6EA" stroke-width="7" stroke-dasharray="9 8" opacity=".9">
      <animate attributeName="opacity" values=".9;.9;0;0;.9;.9" keyTimes="0;0.52;0.53;0.94;0.98;1" dur="6s" repeatCount="indefinite"/>
    </line>
  </g>
  <g data-story="beat-2" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.265;0.405;0.42;1" dur="6s" repeatCount="indefinite"/>
    <rect x="0" y="20" width="70" height="472" fill="url(#beamI)" filter="url(#softI)">
      <animate attributeName="x" values="-20;-20;460;460" keyTimes="0;0.26;0.41;1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
</g>
<g transform="translate(270 334) rotate(-11)">
  <g data-story="beat-5" opacity="0" class="breath"><rect x="-156" y="-86" width="312" height="172" rx="20" fill="none" stroke="#1D6A47" stroke-width="22" filter="url(#glowI)"/></g>
  <g data-story="beat-3" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.450;0.462;0.94;0.98;1" dur="6s" repeatCount="indefinite"/>
    <rect x="-156" y="-86" width="312" height="172" rx="20" fill="none" stroke="#1D6A47" stroke-width="16" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" values="100;100;0;0" keyTimes="0;0.45;0.49;1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g class="slam" data-story="beat-3" opacity="0">
    <rect x="-128" y="-58" width="256" height="116" rx="8" fill="#1D6A47"/>
    <path transform="translate(-80.2 41) scale(1.02)" d="M17.3 0L4.3 0L4.3 -80L17.3 -80L17.3 0M22.5 -26.8L22.1 -26.8L22.1 -38.2L22.5 -38.2Q25.7 -38.2 27.3 -39.7Q28.9 -41.2 29 -44.1L29 -44.1Q29.2 -46.9 29.2 -50.2Q29.3 -53.4 29.2 -56.7Q29.2 -60 29 -62.8L29 -62.8Q28.9 -65.6 27.3 -67.1Q25.7 -68.6 22.5 -68.6L22.5 -68.6L22.1 -68.6L22.1 -80L22.5 -80Q32.6 -80 37.1 -75.9Q41.6 -71.7 41.9 -62.1L41.9 -62.1Q42.1 -57.3 42.1 -53.3Q42.1 -49.2 41.9 -44.7L41.9 -44.7Q41.6 -35.2 37.1 -31Q32.6 -26.8 22.5 -26.8L22.5 -26.8M58.9 0L45.7 0L56.1 -80L78 -80L79.4 -68.6L65.7 -68.6L64.3 -45.7L62.3 -29.7L68.9 -29.7L65.9 -18.3L61.6 -18.3L58.9 0M88.2 0L75 0L69.8 -45.7L69 -64.1L79.7 -64.1L88.2 0M106.8 0L93.8 0L93.8 -80L106.8 -80L106.8 0M128.3 0L115.4 0L115.4 -80L128.3 -80L128.3 0M133.8 0L133.1 0L133.1 -11.4L133.8 -11.4Q137 -11.4 138.6 -12.9Q140.3 -14.4 140.3 -17.2L140.3 -17.2Q140.5 -23 140.5 -28.7Q140.6 -34.3 140.6 -40.1Q140.6 -45.7 140.5 -51.4Q140.5 -57.1 140.3 -62.8L140.3 -62.8Q140.3 -65.6 138.6 -67.1Q137 -68.6 133.8 -68.6L133.8 -68.6L133.1 -68.6L133.1 -80L133.8 -80Q144 -80 148.5 -75.6Q153.1 -71.3 153.2 -61.3L153.2 -61.3Q153.4 -53.7 153.4 -46.9Q153.5 -40.1 153.4 -33.2Q153.4 -26.4 153.2 -18.8L153.2 -18.8Q153.1 -8.7 148.5 -4.4Q144 0 133.8 0L133.8 0" fill="#F3EAD5"/>
  </g>
</g>
</svg>
