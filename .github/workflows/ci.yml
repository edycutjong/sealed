name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: verifier (golden + reproducible wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - run: make test-verifier
      - name: Linux rebuild vs committed bytes (informational)
        # The committed verifier.wasm is built on macOS/arm64; rustc lays out data differently on Linux, so the bytes
        # differ there (same behaviour, checked by the golden tests above). The blocking check is verifier-reproduce.
        continue-on-error: true
        run: make verifier-check

  verifier-reproduce:
    name: verifier.wasm rebuilds byte-for-byte (macOS/arm64, the pinned build host)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: wasm32-wasip1
      - run: make verifier-check
      - name: Keep the rebuilt wasm for diffing when the hash drifts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verifier-rebuilt-macos
          path: target/wasm32-wasip1/release/verifier.wasm

  replay:
    name: replay (creds-free, wasmtime + python only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install wasmtime
        run: |
          curl -fsSL https://wasmtime.dev/install.sh | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
      - run: make replay
      - run: make corpus
      - run: make refusals
      - run: make results
      - run: make bench
      - name: Open every paid delivery (PyNaCl)
        run: python3 -m pip install --quiet pynacl==1.6.2 && make open

  contracts:
    name: contracts (unit + near-workspaces I1–I8)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          targets: wasm32-unknown-unknown
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            contracts
            contracts/itests
      - run: sudo apt-get update && sudo apt-get install -y binaryen
      - run: make test-contracts

  readiness:
    name: readiness + secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 scripts/check_submission_readiness.py
      - name: gitleaks (full history, repo config)
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --log-opts="--all" --redact
