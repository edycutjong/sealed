name: pages
# Secondary mirror of the static site (build/docs/) at the GitHub Pages URL. The canonical
# deployment stays Vercel (https://sealed.edycu.dev). This workflow is INERT while the repo is
# private — Pages on the free tier needs a public repo — and activates automatically at the
# public flip. At the flip, enable Pages with Source = "GitHub Actions" in repo settings once
# (HUMAN-TODO), then this deploys docs/ on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ !github.event.repository.private }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
