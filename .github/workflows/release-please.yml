name: release-please
# Automatic semantic versioning from Conventional Commits. release-please opens/maintains a
# single "release PR" that aggregates commits since the last tag; merging it cuts the GitHub
# Release + tag + CHANGELOG. It never releases on an ordinary push — a human merges the PR —
# so build commits do not fire releases. release-type is "simple" on purpose: it tracks the
# version in .release-please-manifest.json and does NOT edit Cargo.toml, because bumping a
# crate version would change the pinned verifier.wasm / bounty.wasm bytes (see dependabot.yml).
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
